      <div class="app-mark" aria-hidden="true"><svg><use href="#i-film"/></svg></div>
      <h1>Filmsammlung</h1>
      <p class="secondary">Gib deine PIN ein, um auf Sammlung und Wunschliste zuzugreifen.</p>
      <input id="pin" class="field pin-field" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" placeholder="PIN">
      <button class="btn btn-primary" id="login-btn" disabled>Anmelden</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <!-- Scannen -->
    <section class="view view-scan" data-view="scan">
      <div id="reader" class="reader"></div>
      <div class="scan-shade" aria-hidden="true"></div>
      <div class="scan-top">
        <span class="scan-title">Barcode scannen</span>
      </div>
      <div class="finder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="scan-hint" id="scan-hint">Halte den Barcode der Hülle in den Rahmen</p>
      <div class="scan-error glass" id="scan-error" hidden></div>
      <div class="scan-controls">
        <button class="glass-btn" id="torch-btn" aria-label="Taschenlampe" hidden><svg><use href="#i-torch"/></svg></button>
        <button class="glass-btn wide" id="manual-btn"><svg><use href="#i-keys"/></svg><span>EAN eingeben</span></button>
      </div>
    </section>

    <!-- Suchen -->
    <section class="view view-page" data-view="search" hidden>
      <header class="nav"><h1 class="large-title">Suchen</h1></header>
      <form id="search-form" class="group-card form-card">
        <label class="row-field"><span>Titel</span><input id="s-titel" class="row-input" placeholder="z. B. Blade Runner" autocomplete="off"></label>
        <label class="row-field"><span>Jahr</span><input id="s-jahr" class="row-input" inputmode="numeric" maxlength="4" placeholder="optional"></label>
        <label class="row-field"><span>EAN</span><input id="s-ean" class="row-input tnum" inputmode="numeric" maxlength="14" placeholder="statt Titel"></label>
      </form>
      <button class="btn btn-primary block" id="search-btn" form="search-form" disabled>Suchen</button>
      <div id="search-results"></div>
    </section>

    <!-- Listen -->
    <section class="view view-page" data-view="lists" hidden>
      <header class="nav">
        <div class="nav-row">
          <h1 class="large-title" id="lists-title">Sammlung</h1>
          <div class="nav-actions">
            <button class="icon-btn" id="layout-btn" aria-label="Ansicht wechseln"><svg><use href="#i-grid"/></svg></button>
            <button class="icon-btn" id="refresh-btn" aria-label="Aktualisieren"><svg><use href="#i-refresh"/></svg></button>
          </div>
        </div>
        <div class="segmented" role="tablist" id="list-seg">
          <button role="tab" data-liste="Sammlung" aria-selected="true">Sammlung</button>
          <button role="tab" data-liste="Wunschliste" aria-selected="false">Wunschliste</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
        <label class="search-field"><svg><use href="#i-search"/></svg><input id="l-suche" type="search" placeholder="Titel oder EAN" autocomplete="off"></label>
      </header>
      <div id="list-body"></div>
    </section>

    <!-- Übersicht -->
    <section class="view view-page" data-view="stats" hidden>
      <header class="nav"><h1 class="large-title">Übersicht</h1></header>
      <div id="stats-body"></div>
    </section>

    <nav class="tabbar glass" aria-label="Bereiche">
      <span class="tab-thumb" aria-hidden="true"></span>
      <button data-tab="scan" aria-current="page"><svg><use href="#i-scan"/></svg><span>Scannen</span></button>
      <button data-tab="search"><svg><use href="#i-search"/></svg><span>Suchen</span></button>
      <button data-tab="lists"><svg><use href="#i-stack"/></svg><span>Listen</span></button>
      <button data-tab="stats"><svg><use href="#i-chart"/></svg><span>Übersicht</span></button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
